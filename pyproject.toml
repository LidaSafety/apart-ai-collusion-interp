[project]
name = "colx"
version = "0.1.0"
description = "Experiments on multi-agent collusion in LLM agents: detection, fragility, and countermeasures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "torch>=2.14.0",
    "safetensors>=0.4",
    "huggingface-hub>=1.16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "tqdm>=4.66",
    "marimo>=0.25.2",
    "altair>=6.3.0",
    "transformers==5.19.0",
    "accelerate>=1.15.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
col = "colx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "python-semantic-release>=9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colx"]

# ── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ── pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: mirrored test folders need no __init__.py, so no test package shadows a
# real one (e.g. tests/jlens vs the reference jlens library).
addopts = "--import-mode=importlib"
markers = [
    "slow: long-running tests, deselected in CI",
    "gpu: tests that need a GPU, deselected in CI",
]

# ── semantic-release ────────────────────────────────────────────────────────

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/colx/__init__.py:__version__"]
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"
